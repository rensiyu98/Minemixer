name: Deploy to China server

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: minemixer-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts
      - name: Upload and restart
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          rsync -az --delete --exclude '.git/' --exclude '.github/' ./ "$SERVER_USER@$SERVER_HOST:/opt/minemixer/"
          ssh "$SERVER_USER@$SERVER_HOST" 'sudo systemctl restart minemixer && sleep 2 && curl --fail http://127.0.0.1:3000/'
